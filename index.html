<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Lotteries — 18 Number A4 Sheet Generator</title>
<style>
  :root{
    --green:#1b5e37;
    --green-dark:#144428;
    --ink:#1a1a1a;
    --line:#d9ddd7;
    --bg:#f4f6f3;
    --white:#ffffff;
    --err:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;}

  /* Header */
  header.app{
    text-align:center;
    padding:18px 12px 22px;
  }
  header.app img{
    width:96px;height:96px;object-fit:contain;display:block;margin:0 auto 8px;
  }
  header.app .brand{
    font-size:22px;font-weight:800;letter-spacing:1px;color:var(--green);line-height:1.15;
  }
  header.app .brand small{display:block;font-size:15px;font-weight:700;letter-spacing:2px;}
  header.app .reg{font-size:13px;color:var(--green-dark);font-weight:700;margin-top:2px;}
  header.app .sub{
    margin-top:12px;font-size:15px;font-weight:700;letter-spacing:.5px;
    color:#333;text-transform:uppercase;
  }

  .card{
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:20px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .card h2{
    margin:0 0 14px;font-size:15px;letter-spacing:.6px;text-transform:uppercase;
    color:var(--green);font-weight:800;
  }

  /* Number grid inputs */
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  }
  .field{display:flex;align-items:center;gap:8px;}
  .field .num{
    width:26px;font-size:13px;font-weight:700;color:#888;text-align:right;flex:0 0 auto;
  }
  .field input{
    flex:1;min-width:0;padding:12px 10px;font-size:20px;font-weight:800;
    text-align:center;letter-spacing:3px;border:2px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);
    transition:border-color .15s;
  }
  .field input:focus{outline:none;border-color:var(--green);}
  .field input.invalid{border-color:var(--err);background:#fdf0ef;}

  /* Paste */
  textarea{
    width:100%;padding:12px;font-size:15px;border:2px solid var(--line);
    border-radius:8px;resize:vertical;min-height:64px;font-family:inherit;
  }
  textarea:focus{outline:none;border-color:var(--green);}
  .paste-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}

  /* Buttons */
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:8px;
    font-weight:800;letter-spacing:.4px;transition:filter .15s,background .15s;
  }
  button:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--green);color:#fff;font-size:17px;padding:16px 20px;width:100%;
    text-transform:uppercase;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-secondary{
    background:#fff;color:var(--green-dark);border:2px solid var(--green);
    font-size:14px;padding:11px 16px;text-transform:uppercase;
  }
  .btn-secondary:hover{background:#f0f5f1;}
  .btn-ghost{
    background:#eef1ee;color:#555;font-size:14px;padding:11px 16px;text-transform:uppercase;
  }
  .btn-ghost:hover{background:#e3e7e2;}
  .actions{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .actions .btn-primary{flex:2;min-width:200px;}
  .actions .btn-ghost{flex:1;min-width:120px;}

  .errbox{
    display:none;margin-top:14px;padding:12px 14px;background:#fdf0ef;
    border:1px solid #f2c9c4;border-radius:8px;color:var(--err);
    font-size:14px;font-weight:600;line-height:1.5;
  }
  .errbox.show{display:block;}
  .errbox ul{margin:6px 0 0;padding-left:20px;}

  /* Preview */
  .preview-wrap{text-align:center;}
  .preview-frame{
    display:inline-block;max-width:100%;background:#fff;border:1px solid var(--line);
    border-radius:6px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.10);
  }
  .preview-frame img{display:block;width:100%;max-width:520px;height:auto;}
  .preview-empty{
    color:#999;font-size:15px;padding:40px 20px;border:2px dashed var(--line);
    border-radius:10px;
  }
  .dl-actions{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  .dl-actions button{min-width:180px;}
  .dl-actions .btn-primary{width:auto;}

  footer{text-align:center;color:#aaa;font-size:12px;margin-top:30px;}

  @media (max-width:560px){
    .field input{font-size:18px;letter-spacing:2px;padding:11px 6px;}
    .field .num{width:20px;font-size:12px;}
    header.app .brand{font-size:19px;}
  }
</style>
</head>

      <button class="btn-primary" id="downloadBtn">Download A4 Image</button>
      <button class="btn-secondary" id="printBtn">Print</button>
    </div>
  </div>

  <footer>Fortune Lotteries · Fortune Kilimanoor · T.11887</footer>
</div>

<canvas id="a4canvas" width="2480" height="3508" style="display:none;"></canvas>

<script>
const NUM_COUNT = 18;
const inputGrid = document.getElementById('inputGrid');
const inputs = [];

// Build 18 input fields
for(let i=0;i<NUM_COUNT;i++){
  const field = document.createElement('div');
  field.className = 'field';
  const label = document.createElement('span');
  label.className = 'num';
  label.textContent = String(i+1).padStart(2,'0');
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'numeric';
  input.maxLength = 4;
  input.autocomplete = 'off';
  input.dataset.idx = i;
  // Allow only digits; keep as text (preserve leading zeros)
  input.addEventListener('input', ()=>{
    input.value = input.value.replace(/\D/g,'').slice(0,4);
    input.classList.remove('invalid');
    // auto-advance
    if(input.value.length===4 && i<NUM_COUNT-1){ inputs[i+1].focus(); }
  });
  input.addEventListener('paste', (e)=>{
    const text = (e.clipboardData||window.clipboardData).getData('text');
    if(/[,\s]/.test(text)){ e.preventDefault(); distribute(text); }
  });
  field.appendChild(label);
  field.appendChild(input);
  inputGrid.appendChild(field);
  inputs.push(input);
}

// Distribute comma/space separated numbers into fields
function distribute(text){
  const parts = text.split(/[\s,]+/).map(s=>s.trim()).filter(s=>s.length>0);
  for(let i=0;i<NUM_COUNT;i++){
    inputs[i].value = (parts[i]||'').replace(/\D/g,'').slice(0,4);
    inputs[i].classList.remove('invalid');
  }
  if(parts.length>NUM_COUNT){
    showError(['You pasted more than 18 numbers. Only the first 18 were used.']);
  } else {
    hideError();
  }
}

document.getElementById('fillBtn').addEventListener('click', ()=>{
  const t = document.getElementById('pasteBox').value.trim();
  if(!t){ showError(['Paste box is empty.']); return; }
  distribute(t);
});

// Validation
function getNumbers(){ return inputs.map(inp=>inp.value); }

function validate(){
  const nums = getNumbers();
  const errors = [];
  inputs.forEach(inp=>inp.classList.remove('invalid'));
  nums.forEach((n,i)=>{
    if(n.length===0){
      errors.push(`Number ${String(i+1).padStart(2,'0')} is missing.`);
      inputs[i].classList.add('invalid');
    } else if(!/^\d{4}$/.test(n)){
      errors.push(`Number ${String(i+1).padStart(2,'0')} must contain exactly 4 digits.`);
      inputs[i].classList.add('invalid');
    }
  });
  return {ok: errors.length===0, errors, nums};
}

const errBox = document.getElementById('errBox');
function showError(list){
  errBox.innerHTML = '<strong>Please fix the following:</strong><ul>'+
    list.map(e=>`<li>${e}</li>`).join('')+'</ul>';
  errBox.classList.add('show');
}
function hideError(){ errBox.classList.remove('show'); errBox.innerHTML=''; }

// ---- A4 Canvas rendering ----
const canvas = document.getElementById('a4canvas');
const ctx = canvas.getContext('2d');
const logoImg = document.getElementById('logo');
let generatedURL = null;

function drawSheet(nums){
  const W = 2480, H = 3508;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  const margin = 70;                 // outer page margin
  // Header block
  const headerH = 360;
  const headerTop = margin;

  // Draw logo (left) if loaded
  const logoSize = 300;
  const logoX = margin + 20;
  const logoY = headerTop + (headerH - logoSize)/2;
  try{
    if(logoImg.complete && logoImg.naturalWidth>0){
      ctx.drawImage(logoImg, logoX, logoY, logoSize, logoSize);
    }
  }catch(e){}

  // Header text (centered on page)
  ctx.fillStyle = '#144428';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cx = W/2;
  ctx.font = '900 118px Arial, sans-serif';
  ctx.fillText('FORTUNE LOTTERIES', cx, headerTop+110);
  ctx.font = '800 84px Arial, sans-serif';
  ctx.fillText('FORTUNE KILIMANOOR', cx, headerTop+210);
  ctx.font = '700 64px Arial, sans-serif';
  ctx.fillText('T.11887', cx, headerTop+296);

  // Divider line under header
  const dividerY = headerTop + headerH + 10;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(margin, dividerY);
  ctx.lineTo(W-margin, dividerY);
  ctx.stroke();

  // ---- Grid ----
  const gridTop = dividerY + 40;
  const gridBottom = H - margin;
  const gridLeft = margin;
  const gridRight = W - margin;
  const gridW = gridRight - gridLeft;
  const gridH = gridBottom - gridTop;
  const cols = 3, rows = 6;
  const cellW = gridW / cols;
  const cellH = gridH / rows;
  const borderW = 6;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const idx = r*cols + c;
      const x = gridLeft + c*cellW;
      const y = gridTop + r*cellH;

      // cell border
      ctx.strokeStyle = '#000';
      ctx.lineWidth = borderW;
      ctx.strokeRect(x + borderW/2, y + borderW/2, cellW - borderW, cellH - borderW);

      // number — fit font to cell
      const text = nums[idx] || '';
      const maxTextW = cellW * 0.74;
      const maxTextH = cellH * 0.62;
      let fs = Math.floor(cellH * 0.55);
      ctx.font = `900 ${fs}px Arial, sans-serif`;
      // shrink until width fits
      while(ctx.measureText(text).width > maxTextW && fs > 20){
        fs -= 4;
        ctx.font = `900 ${fs}px Arial, sans-serif`;
      }
      if(fs > maxTextH){ fs = Math.floor(maxTextH); ctx.font = `900 ${fs}px Arial, sans-serif`; }

      ctx.fillStyle = '#000';
      ctx.fillText(text, x + cellW/2, y + cellH/2 + fs*0.02);
    }
  }

  return canvas.toDataURL('image/png');
}

// Generate
document.getElementById('generateBtn').addEventListener('click', ()=>{
  const {ok, errors, nums} = validate();
  if(!ok){ showError(errors); document.getElementById('errBox').scrollIntoView({behavior:'smooth',block:'center'}); return; }
  hideError();
  generatedURL = drawSheet(nums);

  const area = document.getElementById('previewArea');
  area.innerHTML = '';
  const frame = document.createElement('div');
  frame.className = 'preview-frame';
  const img = document.createElement('img');
  img.src = generatedURL;
  img.alt = 'Generated A4 Sheet';
  frame.appendChild(img);
  area.appendChild(frame);

  document.getElementById('dlActions').style.display = 'flex';
  area.scrollIntoView({behavior:'smooth', block:'start'});
});

// Download
document.getElementById('downloadBtn').addEventListener('click', ()=>{
  if(!generatedURL) return;
  const a = document.createElement('a');
  a.href = generatedURL;
  a.download = 'fortune-kilimanoor-18-numbers.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

// Print — print only the A4 image
document.getElementById('printBtn').addEventListener('click', ()=>{
  if(!generatedURL) return;
  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>Print</title>
    <style>
      @page{size:A4 portrait;margin:0;}
      html,body{margin:0;padding:0;}
      img{width:100%;height:auto;display:block;}
    </style></head><body>
    <img src="${generatedURL}" onload="setTimeout(function(){window.print();},200);">
    </body></html>`);
  w.document.close();
});

// Clear
document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(confirm('Are you sure you want to clear all 18 numbers?')){
    inputs.forEach(inp=>{ inp.value=''; inp.classList.remove('invalid'); });
    document.getElementById('pasteBox').value='';
    hideError();
    generatedURL=null;
    document.getElementById('previewArea').innerHTML='<div class="preview-empty">Your generated A4 sheet will appear here.</div>';
    document.getElementById('dlActions').style.display='none';
    inputs[0].focus();
  }
});
</script>
</body>
</html>
